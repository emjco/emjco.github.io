<!DOCTYPE html>
<html>
<head>
    <title>EMJCO Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
        }

        /* Top bar */
        .topbar {
            display: flex;
            justify-content: flex-end;
            padding: 20px;
            position: relative;
        }

        /* Menu button */
        .menu-btn {
            background: black;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
        }

        /* Dropdown menu */
        .dropdown {
            display: none;
            position: absolute;
            top: 60px;
            right: 20px;
            background: white;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .dropdown a {
            display: block;
            padding: 12px 20px;
            text-decoration: none;
            color: black;
        }

        .dropdown a:hover {
            background: #f2f2f2;
        }

        /* Sections */
        section {
            padding: 60px 20px;
        }

        h1 {
            margin-top: 80px;
        }
    </style>
</head>

<body>

<div class="topbar">
    <button class="menu-btn" onclick="toggleMenu()">•••</button>

    <div class="dropdown" id="menu">
        <a href="#about">About Me</a>
        <a href="#services">Services</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact Me</a>
    </div>
</div>

<h1>Hello, I’m EMJCO 👋</h1>
<p>Welcome to my portfolio website.</p>

<section id="about">
    <h2>About Me</h2>
    <p>I am learning web development and building modern, simple websites.</p>
</section>

<section id="services">
    <h2>Services</h2>
    <p>Website Creation • Virtual Assistance • Online Support</p>
</section>

<section id="projects">
    <h2>Projects</h2>
    <p>Coming soon...</p>
</section>

<section id="contact">
    <h2>Contact Me</h2>
    <p>Email: your@email.com</p>
</section>

<script>
function toggleMenu() {
    var menu = document.getElementById("menu");
    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}
</script>

</body>
</html>
