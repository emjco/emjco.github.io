<!DOCTYPE html>
<html>
<head>
    <title>EMJCO Portfolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 60px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p.subtitle {
            margin-bottom: 40px;
            color: #555;
        }

        /* Menu bar */
        .menu {
            font-size: 20px;
            margin-bottom: 40px;
        }

        .menu span {
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            margin: 0 10px;
        }

        /* Hover effect */
        .menu span:hover {
            transform: scale(1.2);
            opacity: 0.6;
        }

        /* Preview section */
        #preview {
            margin-top: 30px;
            font-size: 18px;
            min-height: 120px;
            transition: all 0.3s ease;
        }

        .languages {
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <h1>Hello, I’m EMJCO 👋</h1>
    <p class="subtitle">Welcome to my portfolio.</p>

    <div class="menu">
        <span onmouseover="showAbout()">About Me</span> |
        <span onmouseover="showServices()">Services</span> |
        <span onmouseover="showProjects()">Projects</span> |
        <span onmouseover="showContact()">Contact Me</span>
    </div>

    <div id="preview">
        <div class="languages">Languages</div>
        HTML<br>
        CSS<br>
        JavaScript
    </div>

<script>
function showAbout() {
    document.getElementById("preview").innerHTML =
    "<h3>About Me</h3><p>I am building modern, simple and functional websites while growing my skills in development.</p>";
}

function showServices() {
    document.getElementById("preview").innerHTML =
    "<h3>Services</h3><p>Website Creation<br>Virtual Assistance<br>Online Support</p>";
}

function showProjects() {
    document.getElementById("preview").innerHTML =
    "<h3>Projects</h3><p>Portfolio Website<br>Upcoming Client Projects</p>";
}

function showContact() {
    document.getElementById("preview").innerHTML =
    "<h3>Contact Me</h3><p>Email: your@email.com</p>";
}
</script>

</body>
</html>
